name: Build LaTeX Examples
# Compiles all .tex files to validate correctness on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile LaTeX Examples

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            biber \
            latexmk

      - name: Compile all examples
        run: |
          FAILED=0
          FAIL_LIST=""
          PASS_COUNT=0
          FAIL_COUNT=0
          
          # Compile each .tex file
          for texfile in $(find examples -name '*.tex'); do
            dir=$(dirname "$texfile")
            base=$(basename "$texfile" .tex)
            echo "::group::Compiling $texfile"
            
            cd "$dir"
            if pdflatex -interaction=nonstopmode -halt-on-error "$base.tex"; then
              # Run biber if .bcf file was generated (bibliography)
              if [ -f "$base.bcf" ]; then
                biber "$base" && \
                pdflatex -interaction=nonstopmode -halt-on-error "$base.tex"
              fi
              echo "✓ $texfile"
              PASS_COUNT=$((PASS_COUNT + 1))
            else
              echo "::error file=$texfile::Failed to compile $texfile"
              FAILED=1
              FAIL_COUNT=$((FAIL_COUNT + 1))
              FAIL_LIST="$FAIL_LIST  - $texfile\n"
            fi
            
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done
          
          TOTAL=$((PASS_COUNT + FAIL_COUNT))
          echo ""
          echo "===== Compilation Summary ====="
          echo "Total: $TOTAL | Passed: $PASS_COUNT | Failed: $FAIL_COUNT"
          
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "The following files failed to compile:"
            echo -e "$FAIL_LIST"
            exit 1
          fi
          
          echo "✓ All $TOTAL examples compiled successfully"

      - name: Upload PDFs as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: "**/*.pdf"
          retention-days: 7
